server:
  port: ${PORT:8787}
  tomcat:
    max-http-form-post-size: 8MB
    max-swallow-size: 8MB

spring:
  application:
    name: table-top
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/table_top?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:table_top}
    password: ${MYSQL_PASSWORD:table_top_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: simple
  web:
    resources:
      static-locations: file:${TABLE_TOP_STATIC_DIR:${KAIJU_STATIC_DIR:../dist}}/
  servlet:
    multipart:
      max-request-size: 8MB
      max-file-size: 8MB

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.tabletop.model
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 15

table-top:
  auth-secret: ${AUTH_SECRET:}
  token-ttl: P30D
  sqlite-import: ${SQLITE_IMPORT_PATH:}
  max-sync-ops: 500

logging:
  level:
    com.tabletop.mapper: INFO
